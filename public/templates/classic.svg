<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none">
  <!-- Page background -->
  <rect width="240" height="300" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Company name centered -->
  <rect x="75" y="14" width="90" height="8" rx="2" fill="#0f172a"/>
  <!-- Company address centered -->
  <rect x="85" y="25" width="70" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="90" y="30" width="60" height="3" rx="1.5" fill="#94a3b8"/>
  <!-- Double divider -->
  <rect x="16" y="40" width="208" height="3" rx="0" fill="#2563eb"/>
  <rect x="16" y="44" width="208" height="1" rx="0" fill="#2563eb" opacity="0.4"/>
  <!-- INVOICE centered -->
  <text x="120" y="60" text-anchor="middle" font-family="serif" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="3">INVOICE</text>
  <!-- Invoice number centered -->
  <rect x="88" y="65" width="64" height="5" rx="1.5" fill="#0f172a" opacity="0.6"/>
  <!-- Status badge centered -->
  <rect x="100" y="73" width="40" height="6" rx="3" fill="#2563eb"/>
  <!-- Date row -->
  <rect x="16" y="90" width="50" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="16" y="95" width="60" height="4" rx="1.5" fill="#0f172a" opacity="0.7"/>
  <rect x="160" y="90" width="64" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="174" y="95" width="50" height="4" rx="1.5" fill="#0f172a" opacity="0.7"/>
  <!-- Party boxes -->
  <rect x="16" y="108" width="98" height="44" rx="2" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="114" width="28" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="24" y="120" width="60" height="5" rx="2" fill="#0f172a"/>
  <rect x="24" y="128" width="50" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="24" y="133" width="42" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="126" y="108" width="98" height="44" rx="2" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="134" y="114" width="28" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="134" y="120" width="60" height="5" rx="2" fill="#0f172a"/>
  <rect x="134" y="128" width="50" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="134" y="133" width="42" height="3" rx="1.5" fill="#94a3b8"/>
  <!-- Bordered table -->
  <rect x="16" y="162" width="208" height="74" rx="2" stroke="#2563eb" stroke-width="1"/>
  <rect x="16" y="162" width="208" height="14" rx="0" fill="#2563eb"/>
  <rect x="16" y="176" width="208" height="1" fill="#e2e8f0"/>
  <rect x="16" y="189" width="208" height="1" fill="#e2e8f0"/>
  <rect x="16" y="202" width="208" height="1" fill="#e2e8f0"/>
  <rect x="16" y="215" width="208" height="1" fill="#e2e8f0"/>
  <!-- Totals right -->
  <rect x="136" y="248" width="88" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="136" y="254" width="88" height="1" fill="#2563eb"/>
  <rect x="136" y="258" width="40" height="5" rx="2" fill="#2563eb"/>
  <rect x="200" y="258" width="24" height="5" rx="2" fill="#2563eb"/>
  <!-- Signature lines -->
  <rect x="16" y="282" width="80" height="1" fill="#0f172a"/>
  <rect x="144" y="282" width="80" height="1" fill="#0f172a"/>
  <rect x="30" y="286" width="52" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="157" y="286" width="54" height="3" rx="1.5" fill="#94a3b8"/>
</svg>