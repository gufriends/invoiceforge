  <rect x="16" y="280" width="208" height="1" fill="#e2e8f0"/>
  <rect x="16" y="284" width="80" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="200" y="284" width="24" height="3" rx="1.5" fill="#cbd5e1"/>
