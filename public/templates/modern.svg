<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none">
  <!-- Page background -->
  <rect width="240" height="300" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Brand bar -->
  <rect x="16" y="16" width="36" height="4" rx="2" fill="#10b981"/>
  <!-- Company name -->
  <rect x="16" y="26" width="70" height="6" rx="2" fill="#0f172a"/>
